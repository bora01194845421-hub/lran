name: 이란전쟁 파이프라인 자동 실행

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: .env 생성
        shell: bash
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}
          GUARDIAN_API_KEY=${{ secrets.GUARDIAN_API_KEY }}
          NYT_API_KEY=${{ secrets.NYT_API_KEY }}
          BRAVE_API_KEY=${{ secrets.BRAVE_API_KEY }}
          OPINET_API_KEY=${{ secrets.OPINET_API_KEY }}
          KOSIS_API_KEY=${{ secrets.KOSIS_API_KEY }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          EOF

      - name: 파이프라인 실행
        run: python orchestrator.py

      - name: 결과 데이터 자동 커밋 & push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: 파이프라인 결과 $(date '+%Y-%m-%d %H:%M KST')"
          git push origin HEAD:${{ github.ref_name }}
